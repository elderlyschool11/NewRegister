<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนข้อมูลผู้สูงอายุ</title>
    <!-- Google Fonts: Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- SweetAlert2 for beautiful alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        :root {
            --primary-color: #0052D4;
            --secondary-color: #6FB1FC;
            --bg-gradient: linear-gradient(135deg, #eeeeee 0%, #0052D4 100%);
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
        }

        /* Animation หน้าต่างเคลื่อนไหว */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.8s ease-out;
            margin: 20px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: var(--primary-color);
            margin: 0;
            font-weight: 600;
            font-size: 24px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-color);
            font-weight: 400;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
            font-size: 16px;
            background-color: #f9f9f9;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 82, 212, 0.2);
            background-color: #fff;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #0052D4, #4364F7, #6FB1FC);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 82, 212, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            box-shadow: 0 8px 20px rgba(0, 82, 212, 0.4);
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ลงทะเบียนผู้สูงอายุ</h2>
        <p>กรุณากรอกข้อมูลให้ครบถ้วนเพื่อการดูแลที่ดียิ่งขึ้น</p>
    </div>

    <form id="regForm">
        <div class="row">
            <div class="form-group">
                <label>ชื่อ</label>
                <input type="text" id="firstName" placeholder="ชื่อ" required>
            </div>
            <div class="form-group">
                <label>นามสกุล</label>
                <input type="text" id="lastName" placeholder="นามสกุล" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>อายุ (ปี)</label>
                <input type="number" id="age" placeholder="เช่น 65" required>
            </div>
            <div class="form-group">
                <label>เพศ</label>
                <select id="gender">
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง">หญิง</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>น้ำหนัก (กก.)</label>
                <input type="number" id="weight" step="0.1" placeholder="0.0">
            </div>
            <div class="form-group">
                <label>ส่วนสูง (ซม.)</label>
                <input type="number" id="height" placeholder="0">
            </div>
        </div>

        <div class="form-group">
            <label>โรคประจำตัว (ถ้าไม่มีให้ระบุ -)</label>
            <input type="text" id="disease" placeholder="ระบุโรคประจำตัว">
        </div>

        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
        <div class="loading" id="loader">กำลังบันทึกข้อมูล...</div>
    </form>
</div>

<script>
    // --- เปลี่ยนค่าตรงนี้ตามข้อมูลของคุณ ---
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwGk1_rCeSC6ZyapEAlTiBptsSsRQOvyNBnuClNk0EprtkU9sBgLGsps2xufBita9H3/exec"; 
    const LIFF_ID = "2009988267-nMo5Svwe";
    // -------------------------------

    let userId = "";

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                userId = profile.userId;
            }
        } catch (err) {
            console.error("LIFF Init Error:", err);
        }
    }
    main();

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Show Loading
        const btn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        btn.disabled = true;
        btn.style.opacity = "0.7";
        loader.style.display = "block";

        const formData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            weight: document.getElementById('weight').value,
            height: document.getElementById('height').value,
            disease: document.getElementById('disease').value,
            userId: userId
        };

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors', // สำคัญ: เพื่อเลี่ยงปัญหา CORS ใน GAS
                body: JSON.stringify(formData)
            });
            
            // ใช้ SweetAlert2 แจ้งเตือน
            await Swal.fire({
                title: 'สำเร็จ!',
                text: 'บันทึกข้อมูลของคุณเรียบร้อยแล้ว',
                icon: 'success',
                confirmButtonColor: '#0052D4',
                confirmButtonText: 'ตกลง'
            });

            liff.closeWindow(); // ปิดหน้าต่างอัตโนมัติ

        } catch (error) {
            Swal.fire({
                title: 'เกิดข้อผิดพลาด',
                text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่',
                icon: 'error'
            });
            btn.disabled = false;
            btn.style.opacity = "1";
            loader.style.display = "none";
        }
    });
</script>

</body>
</html>
