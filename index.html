<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนผู้สูงอายุ</title>
    <!-- Google Fonts: Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --secondary: #64748b;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #dbeafe, #ffffff, #eff6ff);
            background-attachment: fixed;
            color: var(--text-main);
        }

        /* Container & Card */
        .container {
            width: 92%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin: 20px 0;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header .icon-box {
            width: 70px;
            height: 70px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px;
        }

        .header h2 {
            font-size: 26px;
            font-weight: 600;
            color: var(--primary);
            margin: 0;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 15px;
        }

        .input-label i {
            color: var(--primary);
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
            background-color: white;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            transform: translateY(-1px);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Custom Button */
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Loading */
        .loader-dots {
            display: none;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 15px;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .container { padding: 30px 20px; }
            .header h2 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon-box">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2>ลงทะเบียนข้อมูล</h2>
        <p>บันทึกข้อมูลเพื่อรับการดูแลที่เหมาะสม</p>
    </div>

    <form id="regForm">
        <div class="row">
            <div class="form-group">
                <label class="input-label"><i class="fas fa-user"></i> ชื่อ</label>
                <input type="text" id="firstName" placeholder="ชื่อ" required>
            </div>
            <div class="form-group">
                <label class="input-label">นามสกุล</label>
                <input type="text" id="lastName" placeholder="นามสกุล" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label class="input-label"><i class="fas fa-calendar-alt"></i> อายุ (ปี)</label>
                <input type="number" id="age" placeholder="เช่น 65" required>
            </div>
            <div class="form-group">
                <label class="input-label"><i class="fas fa-venus-mars"></i> เพศ</label>
                <select id="gender">
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง">หญิง</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label class="input-label"><i class="fas fa-weight"></i> น้ำหนัก (กก.)</label>
                <input type="number" id="weight" step="0.1" placeholder="0.0">
            </div>
            <div class="form-group">
                <label class="input-label"><i class="fas fa-ruler-vertical"></i> ส่วนสูง (ซม.)</label>
                <input type="number" id="height" placeholder="0">
            </div>
        </div>

        <div class="form-group">
            <label class="input-label"><i class="fas fa-notes-medical"></i> โรคประจำตัว</label>
            <input type="text" id="disease" placeholder="ถ้าไม่มีให้ระบุ -">
        </div>

        <button type="submit" id="submitBtn">
            <span>บันทึกข้อมูล</span>
            <i class="fas fa-chevron-right"></i>
        </button>
        
        <div class="loader-dots" id="loader">
            <i class="fas fa-circle-notch fa-spin"></i> กำลังบันทึกข้อมูล...
        </div>
    </form>
</div>

<script>
    // --- เปลี่ยนค่าตรงนี้ตามข้อมูลของคุณ ---
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwGk1_rCeSC6ZyapEAlTiBptsSsRQOvyNBnuClNk0EprtkU9sBgLGsps2xufBita9H3/exec"; 
    const LIFF_ID = "2009988267-nMo5Svwe";
    // -------------------------------

    let userId = "";

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                userId = profile.userId;
            }
        } catch (err) {
            console.error("LIFF Init Error:", err);
        }
    }
    main();

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        
        // Show Loading UI
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> บันทึกข้อมูล...';
        loader.style.display = "block";

        const formData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            weight: document.getElementById('weight').value,
            height: document.getElementById('height').value,
            disease: document.getElementById('disease').value,
            userId: userId
        };

        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(formData)
            });
            
            await Swal.fire({
                title: 'สำเร็จ!',
                text: 'บันทึกข้อมูลของคุณเรียบร้อยแล้ว',
                icon: 'success',
                confirmButtonColor: '#2563eb',
                confirmButtonText: 'ตกลง',
                backdrop: `rgba(0,0,0,0.4)`,
                padding: '2em',
                borderRadius: '20px'
            });

            liff.closeWindow();

        } catch (error) {
            Swal.fire({
                title: 'เกิดข้อผิดพลาด',
                text: 'ไม่สามารถบันทึกได้ในขณะนี้ กรุณาลองใหม่',
                icon: 'error',
                confirmButtonColor: '#2563eb'
            });
            btn.disabled = false;
            btn.innerHTML = '<span>บันทึกข้อมูล</span><i class="fas fa-chevron-right"></i>';
            loader.style.display = "none";
        }
    });
</script>

</body>
</html>
